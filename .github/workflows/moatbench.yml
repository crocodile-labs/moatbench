# Proposed workflow. It is not active here: copy this file to
# .github/workflows/moatbench.yml when this repository is published.
#
# It runs on public runners and installs each guard at the version pinned in its
# contestant file. Actions are pinned to full commit ids; the Python and Node
# minor versions below are the runner toolchain, and every result records the
# exact versions it ran with.
name: moatbench

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate the scenarios and contestants
        run: python3 moatbench.py validate
      - name: Test the runner against fake hooks
        run: python3 -m unittest discover -s tests

  run:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install every guard at its pinned version and score it
        env:
          RESULTS: results/${{ matrix.os }}
        run: >-
          python3 moatbench.py run --install
          --tools-dir "$RUNNER_TEMP/moatbench-tools"
          --scratch "$RUNNER_TEMP/moatbench-scratch"
          --out "$RESULTS"
      - name: Show the table in the run summary
        env:
          RESULTS: results/${{ matrix.os }}
        run: cat "$RESULTS/results.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: moatbench-${{ matrix.os }}
          path: results/${{ matrix.os }}
          if-no-files-found: error
