# bash-authorize: https://github.com/rse/bash-authorize
name = "bash-authorize"
version = "0.9.9"
homepage = "https://github.com/rse/bash-authorize"
install = ["npm install --prefix {tool_dir} bash-authorize@0.9.9 --ignore-scripts"]
hook = "node {tool_dir}/node_modules/bash-authorize/dist/bash-authorize-cli.js"
# The matcher its README shows for registering the hook.
matcher = "Bash"
version_command = "node {tool_dir}/node_modules/bash-authorize/dist/bash-authorize-cli.js --version"

[scope]
summary = "Claude Code PreToolUse hook for the Bash tool: auto-approves inert commands, gates dangerous ones."
source = "https://github.com/rse/bash-authorize#readme (README of 0.9.9)"
tools = ["Bash"]
categories = ["*"]
