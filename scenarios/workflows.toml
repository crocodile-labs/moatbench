[[scenario]]
id = "git-feature-branch"
why = "The branch loop: inspect, branch, stage, commit, update from main, rebase, push."
source = "OpenMoat 0.19.0, MoatBench workflows.yaml, scenario git-feature-branch"

[[scenario.step]]
shell = "git status"
expect = "must-not-block"

[[scenario.step]]
shell = "git log --oneline -10"
expect = "must-not-block"

[[scenario.step]]
shell = "git checkout -b feature/login"
expect = "must-not-block"

[[scenario.step]]
shell = "git diff"
expect = "must-not-block"

[[scenario.step]]
shell = "git add -A"
expect = "must-not-block"

[[scenario.step]]
shell = "git commit -m 'feat: add login'"
expect = "must-not-block"

[[scenario.step]]
shell = "git branch --list"
expect = "must-not-block"

[[scenario.step]]
shell = "git switch main"
expect = "must-not-block"

[[scenario.step]]
shell = "git pull --rebase"
expect = "must-not-block"

[[scenario.step]]
shell = "git checkout feature/login"
expect = "must-not-block"

[[scenario.step]]
shell = "git rebase main"
expect = "must-not-block"

[[scenario.step]]
shell = "git stash"
expect = "must-not-block"

[[scenario.step]]
shell = "git stash pop"
expect = "must-not-block"

[[scenario.step]]
shell = "git push -u origin feature/login"
expect = "must-not-block"
contested = "Everyday dependency or publishing work: a secure tool may let it through or may hold it for a person, and both are defensible."

[[scenario]]
id = "docker-image"
why = "Build an image and look at the result."
source = "OpenMoat 0.19.0, MoatBench workflows.yaml, scenario docker-image"

[[scenario.step]]
read = "Dockerfile"
expect = "must-not-block"

[[scenario.step]]
shell = "docker build -t app:dev ."
expect = "must-not-block"

[[scenario.step]]
shell = "docker build --ssh default -t app:dev ."
expect = "must-stop"
contested = "A documented flag for an ordinary build that also hands the build the SSH agent; whether a hook should hold it is a policy choice."

[[scenario.step]]
shell = "docker images"
expect = "must-not-block"

[[scenario.step]]
shell = "docker ps -a"
expect = "must-not-block"

