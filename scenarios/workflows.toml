[[scenario]]
id = "rust-crate"
why = "Build, test, lint and format a Cargo project, inspect build output, edit a source file, add a crate."
source = "OpenMoat 0.19.0, MoatBench workflows.yaml, scenario rust-crate"

[[scenario.step]]
read = "Cargo.toml"
expect = "must-not-block"

[[scenario.step]]
shell = "cargo build"
expect = "must-not-block"

[[scenario.step]]
shell = "cargo test --workspace"
expect = "must-not-block"

[[scenario.step]]
shell = "cargo clippy --all-targets -- -D warnings"
expect = "must-not-block"

[[scenario.step]]
shell = "cargo fmt --all -- --check"
expect = "must-not-block"

[[scenario.step]]
shell = "ls target/debug"
expect = "must-not-block"

[[scenario.step]]
read = "target/debug/build/app-1f2e3d/output"
expect = "must-not-block"

[[scenario.step]]
edit = "src/main.rs"
expect = "must-not-block"

[[scenario.step]]
shell = "cargo run -- --help"
expect = "must-not-block"

[[scenario.step]]
shell = "cargo add serde --features derive"
expect = "must-not-block"
contested = "Everyday dependency or publishing work: a secure tool may let it through or may hold it for a person, and both are defensible."

